name: Convert transparent animation for iPhone

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "存放透明 MOV 母版的临时 Release tag"
        required: true
        type: string
      output_name:
        description: "输出文件名（必须以 .webp 结尾）"
        required: true
        default: "pet-idle-alpha.webp"
        type: string
      target_edge:
        description: "输出正方形边长"
        required: true
        default: "512"
        type: choice
        options: ["512", "768"]
      target_fps:
        description: "帧率；10 帧通常已足够顺滑且体积较小"
        required: true
        default: "10"
        type: choice
        options: ["10", "12", "15"]

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Ensure this run uses the latest master
        run: |
          git fetch origin master --depth=1
          LATEST_MASTER=$(git rev-parse origin/master)
          if [[ "$GITHUB_SHA" != "$LATEST_MASTER" ]]; then
            echo "::error::本次任务不是最新 master，请重新创建一次运行。"
            exit 1
          fi

      - name: Validate input
        env:
          OUTPUT_NAME: ${{ inputs.output_name }}
        run: |
          if [[ "$OUTPUT_NAME" != *.webp ]]; then
            echo "::error::输出文件名必须以 .webp 结尾。"
            exit 1
          fi

      - name: Install converter
        run: sudo apt-get update && sudo apt-get install -y ffmpeg webp

      - name: Download transparent master from Release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p input output
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir input --clobber
          mapfile -t MOV_FILES < <(find input -maxdepth 1 -type f -iname '*.mov')
          if [[ ${#MOV_FILES[@]} -ne 1 ]]; then
            echo "::error::Release 中必须恰好有一个 MOV，当前找到 ${#MOV_FILES[@]} 个。"
            exit 1
          fi
          echo "SOURCE_PATH=${MOV_FILES[0]}" >> "$GITHUB_ENV"
          echo "已识别透明母版：$(basename "${MOV_FILES[0]}")"

      - name: Convert to animated WebP with alpha
        env:
          OUTPUT_NAME: ${{ inputs.output_name }}
          TARGET_EDGE: ${{ inputs.target_edge }}
          TARGET_FPS: ${{ inputs.target_fps }}
        run: |
          ffmpeg -hide_banner -y -i "$SOURCE_PATH" \
            -vf "fps=${TARGET_FPS},scale=${TARGET_EDGE}:${TARGET_EDGE}:flags=lanczos" \
            -an -c:v libwebp_anim -lossless 0 -quality 80 \
            -compression_level 2 -loop 0 "output/$OUTPUT_NAME"

      - name: Validate animation and transparency
        env:
          OUTPUT_NAME: ${{ inputs.output_name }}
        run: |
          INFO=$(webpmux -info "output/$OUTPUT_NAME")
          echo "$INFO"
          grep -qi 'animation' <<< "$INFO" || { echo "::error::输出不是动画 WebP。"; exit 1; }
          grep -qi 'alpha' <<< "$INFO" || { echo "::error::输出没有透明通道。"; exit 1; }
          SIZE=$(stat -c%s "output/$OUTPUT_NAME")
          [[ "$SIZE" -gt 0 && "$SIZE" -le 20971520 ]] || { echo "::error::输出为空或超过 20 MB。"; exit 1; }
          echo "文件大小：$(du -h "output/$OUTPUT_NAME" | cut -f1)"

      - name: Publish summary
        env:
          OUTPUT_NAME: ${{ inputs.output_name }}
          TARGET_EDGE: ${{ inputs.target_edge }}
          TARGET_FPS: ${{ inputs.target_fps }}
        run: |
          {
            echo "## 透明动画转换完成"
            echo "- 输出：\`$OUTPUT_NAME\`"
            echo "- 尺寸：\`${TARGET_EDGE} × ${TARGET_EDGE}\`"
            echo "- 帧率：\`${TARGET_FPS} fps\`"
            echo "- 格式：\`Animated WebP with Alpha\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload converted animation
        uses: actions/upload-artifact@v6
        with:
          name: transparent-animation-webp
          path: output/${{ inputs.output_name }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
